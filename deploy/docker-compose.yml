name: acc-core

services:
  workbench:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: acc-core:${IMAGE_TAG:-latest}
    container_name: acc-core
    ports:
      - "${HOST_PORT:-3780}:3780"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3780"
      WORKBENCH_PASSWORD: "${WORKBENCH_PASSWORD:?set WORKBENCH_PASSWORD in deploy/.env}"
      WORKBENCH_ADMIN_USER: "${WORKBENCH_ADMIN_USER:-admin}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      SECURE_COOKIE: "${SECURE_COOKIE:-0}"
      PERSIST_DIR: "/data"
      CHROME_PATH: "/usr/bin/google-chrome-stable"
      MAX_CONCURRENCY: "${MAX_CONCURRENCY:-8}"
      PW_CF_MAX: "${PW_CF_MAX:-4}"
      OPENAPI_KEY: "${OPENAPI_KEY:-}"
      OPENAPI_CORS: "${OPENAPI_CORS:-*}"
      OPENAPI_MAX_KEYS: "${OPENAPI_MAX_KEYS:-3}"
      OPENAPI_RATE_LIMIT: "${OPENAPI_RATE_LIMIT:-60}"
    volumes:
      - acc-data:/data
    shm_size: "2gb"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3780/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  acc-data:
